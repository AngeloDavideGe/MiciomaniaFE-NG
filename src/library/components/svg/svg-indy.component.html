<div class="svg-container" style="position: relative; display: inline-block">
  <svg
    baseprofile="tiny"
    [attr.height]="height()"
    [attr.width]="width()"
    stroke="var(--border)"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="1.2"
    version="1.2"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    xmlns="http://www.w3.org/2000/svg"
    [style.transform]="transform()"
  >
    <g [attr.transform]="translate()">
      @for (path of paths(); track $index) {
        @if (path.d) {
          <path
            [attr.d]="path.d"
            [attr.id]="path.title"
            [attr.fill]="
              path.fill || colori()[path.title] || 'var(--primary-light)'
            "
            [attr.stroke]="path.stroke || null"
            [attr.stroke-width]="path.strokeWidth || null"
            (click)="onPathClick(path, $event)"
          >
            <title>{{ path.title }}</title>
          </path>
        }

        @if (path.displayText !== "") {
          <text
            [attr.x]="path.textX"
            [attr.y]="path.textY"
            [attr.text-anchor]="path.textAnchor || 'middle'"
            dominant-baseline="middle"
            [attr.fill]="path.textFill || 'var(--text)'"
            [attr.font-weight]="path.textWeight || 'bold'"
            [attr.font-size]="path.textSize || 16"
          >
            <title>{{ path.title }}</title>
            {{ path.displayText || path.title }}
          </text>
        }
      }
    </g>
  </svg>

  @if (modale()) {
    <div class="popup" [style.left.px]="popupX()" [style.top.px]="popupY()">
      <button (click)="modale.set(null)" class="close-btn">×</button>
      <pre>{{ modale()?.proprietario }} - {{ modale()?.descrizione }}</pre>
    </div>
  }
</div>
