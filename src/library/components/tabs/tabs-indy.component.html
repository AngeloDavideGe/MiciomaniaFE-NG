<nav class="nav nav-tabs border-bottom-0">
  @for (tab of tabs(); track tab.id) {
    <button
      class="nav-link tab-item me-2 px-3 py-2"
      (click)="clickTabFunc(tab)"
      [style.color]="
        selectTab() === tab.id ? tab.color || 'var(--primary)' : 'var(--text)'
      "
      [style.border-bottom]="
        selectTab() === tab.id
          ? '2px solid ' + tab.color
          : '2px solid var(--border)'
      "
    >
      @if (tab.label) {
        {{ tab.label }}
      }

      @if (tab.icona) {
        <i
          [class]="tab.icona"
          [style]="{ 'padding-left': tab.label ? '1rem' : '0' }"
        ></i>
      }
    </button>
  }
</nav>
