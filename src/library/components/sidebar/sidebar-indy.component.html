<div class="container" style="padding: 0">
  <div class="sidebar-wrapper" [style.width]="width()">
    <div class="sidebar-card">
      <h3>{{ titolo() }}</h3>

      <div class="sidebar-list">
        @for (item of elementi(); track item.id) {
          <button
            class="sidebar-item"
            [class.active]="selezionato() === item.id"
            (click)="selezionato.set(item.id)"
          >
            <i class="bi" [class]="item.icona"></i>

            <span>{{ item.nome }}</span>
          </button>
        }
      </div>
    </div>

    <div class="down-content-wrapper">
      <ng-content select="[down-content]"></ng-content>
    </div>
  </div>

  <div class="content-wrapper">
    <ng-content></ng-content>
  </div>
</div>
