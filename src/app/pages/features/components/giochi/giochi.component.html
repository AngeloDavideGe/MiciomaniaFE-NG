<app-container-micio>
  <app-descrizione-micio
    [titolo]="currentDescrizione().Titolo"
    [descrizione]="currentDescrizione().Descrizione"
    [immagine]="'https://i.postimg.cc/Y0w3Z0mW/Giochi-Card.png'"
  >
    <div half-row>
      @if (isGiochi$ | async) {
        <app-toolbar-micio
          [placeholder]="lang.CercaPlaceholder"
          [typeFilter]="'select'"
          [itemsSelect]="giochiSelect"
          [(selectedItems)]="selectedItems"
        />
      }
    </div>

    <div all-row>
      <div class="pt-1"></div>

      @if (isGiochi$ | async) {
        <app-card-indy
          [elems]="filtri().elemFilter()"
          [altezzaImg]="'15rem'"
          [lunghezzaCard]="'18rem'"
          [tipoSlice]="'page'"
          [tipoPaginazione]="'multiplo'"
          [arrayPags]="arrayRaggi"
        />
        <div class="pt-3"></div>
      } @else {
        <router-outlet />
      }
    </div>
  </app-descrizione-micio>
</app-container-micio>
