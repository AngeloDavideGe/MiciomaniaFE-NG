<app-container-micio
  [titolo]="lang.Titolo"
  [descrizione]="lang.Descrizione"
  [immagine]="'https://images.unsplash.com/photo-1515879218367-8466d910aaa4'"
>
  <div half-row>
    <app-toolbar-micio
      [stats]="mangaToolbar()"
      [placeholder]="lang.CercaPlaceholder"
      [(searchQuery)]="searchQuery"
    />
  </div>

  <div all-row>
    <div class="elemento-centrato p-2">
      <app-tabs-indy
        [tabs]="tabs"
        (clickTab)="currentTabs.set(recordTabs[$event])"
      />
    </div>

    <div class="mt-2"></div>

    <app-sidebar-indy
      [titolo]="lang.CategorieTitolo"
      [elementi]="categorie"
      [(selezionato)]="currentCategoria"
    >
      <div down-content>
        <app-sidebar-indy
          [width]="'100%'"
          [titolo]="lang.SottocategorieTitolo"
          [elementi]="sottoCategorie"
          [(selezionato)]="currentSottoCategoria"
        />
      </div>

      @if (viewSpinner()) {
        <app-spinner-indy [mt]="'5rem'" />
      } @else {
        <app-card-indy
          [elems]="dataCard()"
          [altezzaImg]="'15rem'"
          [cardGap]="'1rem'"
          [lunghezzaCard]="'18rem'"
          [tipoSlice]="'page'"
          [tipoPaginazione]="'multiplo'"
          [arrayPags]="arrayRaggi"
        />

        <div class="mt-2"></div>
      }
    </app-sidebar-indy>
  </div>
</app-container-micio>
